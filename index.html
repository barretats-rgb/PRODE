<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Prode Refugio · Mundial 2026</title>
<link rel="stylesheet" href="colors_and_type.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
  html,body{
    margin:0; min-height:100%;
    background:
      radial-gradient(circle at 20% 0%, rgba(191,97,42,0.10), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(232,242,106,0.06), transparent 50%),
      var(--char-900);
    font-family: var(--font-body);
    color: var(--cream-100);
    overflow-x:hidden;
  }
  *{box-sizing:border-box}
  button{font-family:var(--font-body);}
  input,textarea{font-family:var(--font-body);}
  /* hide scrollbars on horizontal scrollers */
  ::-webkit-scrollbar{ display:none; }

  /* layout */
  .stage{
    display:flex; gap:42px; justify-content:center; align-items:flex-start;
    padding:48px 24px 80px; min-height:100vh;
    flex-wrap:wrap;
  }
  .stage > .col{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .col-label{
    font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--char-400);
    font-weight:700; text-align:center;
  }
  .col-label b{ color: var(--neon-citrus); font-weight:700; }

  /* phone frame */
  .phone{
    width:392px; height:820px; border-radius:48px; overflow:hidden;
    background: var(--char-900);
    position:relative;
    box-shadow:
      0 0 0 11px #0c0b0a,
      0 0 0 12px #2a2724,
      0 0 0 13px #0c0b0a,
      0 40px 80px -30px rgba(0,0,0,0.85),
      0 20px 40px -20px rgba(0,0,0,0.6);
  }
  .phone::before{
    content:""; position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:106px; height:30px; background:#0c0b0a; border-radius:99px; z-index:30;
  }
  .phone .viewport{
    position:absolute; inset:0; overflow-y:auto;
    background:var(--char-900);
    display:flex; flex-direction:column;
    padding-top:46px;
  }
  .phone .viewport::-webkit-scrollbar{ display:none; }

  /* nav strip below phone */
  .screenNav{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:392px;
  }
  .screenNav button{
    padding:7px 11px; border-radius:999px; cursor:pointer;
    background: var(--char-800); border:1px solid var(--char-700);
    color: var(--char-200); font-weight:700;
    font-size:9px; letter-spacing:0.16em; text-transform:uppercase;
  }
  .screenNav button.on{
    background: var(--neon-citrus); color:var(--char-900); border-color:var(--neon-citrus);
  }
  .screenNav button.admin{ border-color: var(--orange-500); color:var(--orange-400); }
  .screenNav button.admin.on{ background:var(--orange-500); color:var(--cream-50); }

  /* header brand strip — show only at top of page */
  .brand-strip{
    width:100%; padding:18px 22px 0;
    display:flex; align-items:center; justify-content:space-between;
    color:var(--cream-100);
    position:absolute; top:0; left:0; z-index:5;
  }
  .brand-strip .lock{
    display:inline-flex; gap:8px; align-items:center;
    font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--char-400);
    font-weight:700;
  }

  /* phone status bar */
  .statusbar{
    position:absolute; top:0; left:0; right:0; height:46px; z-index:20;
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 32px 0; pointer-events:none;
    font-size:13px; font-weight:700; color:var(--cream-100);
    font-family:var(--font-body);
  }
  .statusbar .icons{ display:inline-flex; gap:5px; align-items:center; }
  .statusbar .icons svg{ width:14px; height:14px; }

  /* desktop preview (admin) */
  .desktop{
    width:980px; max-width:90vw; aspect-ratio:16/10;
    border-radius:18px; overflow:hidden;
    background: var(--char-900);
    border:1px solid var(--char-700);
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.85), 0 20px 40px -20px rgba(0,0,0,0.6);
    position:relative;
  }
  .desktop-titlebar{
    height:32px; background:var(--char-800); display:flex; align-items:center; gap:7px;
    padding:0 14px; border-bottom:1px solid var(--char-700);
  }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:#ff5f57 } .dot.y{ background:#febc2e } .dot.g{ background:#28c840 }
  .desktop-url{
    margin-left:14px; padding:4px 12px; border-radius:6px;
    background:var(--char-900); border:1px solid var(--char-700);
    font-family:var(--font-mono); font-size:10px; color:var(--char-400);
    letter-spacing:0.04em;
  }
  .desktop-body{
    position:absolute; inset:32px 0 0; overflow:hidden;
  }

  /* footer */
  .footer-meta{
    width:100%; padding:60px 24px 24px; text-align:center;
    color:var(--char-500); font-size:10px; letter-spacing:0.22em; text-transform:uppercase;
    font-weight:700;
  }
  .footer-meta b{ color:var(--neon-citrus); }
</style>
</head>
<body>

<div class="brand-strip">
  <div style="font-family:Mauren,sans-serif;font-size:22px;line-height:0.85;text-transform:uppercase;color:var(--orange-500);">
    REFU<br/><span style="padding-left:0.55em;display:inline-block;color:var(--cream-100);">GIO</span>
  </div>
  <div class="lock">
    <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--neon-citrus);box-shadow:0 0 10px var(--neon-citrus);"></span>
    Prode Mundial '26 · v0.1 · Tamarindo
  </div>
</div>

<div id="root"></div>

<!-- data + components -->
<script src="data.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-service.js"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<!-- screens -->
<script type="text/babel" src="screens/Landing.jsx"></script>
<script type="text/babel" src="screens/Register.jsx"></script>
<script type="text/babel" src="screens/Matches.jsx"></script>
<script type="text/babel" src="screens/Ranking.jsx"></script>
<script type="text/babel" src="screens/Specials.jsx"></script>
<script type="text/babel" src="screens/Profile.jsx"></script>
<script type="text/babel" src="screens/Groups.jsx"></script>
<script type="text/babel" src="screens/Admin.jsx"></script>

<script type="text/babel" data-presets="react">
/* useState/useEffect/useRef come from components.jsx (global const) */

const SCREENS = {
  home:     { label:"Home",         comp:"Landing",  tab:"home"    },
  register: { label:"Registro",     comp:"Register", tab:null      },
  matches:  { label:"Predicciones", comp:"Matches",  tab:"matches" },
  ranking:  { label:"Ranking",      comp:"Ranking",  tab:"ranking" },
  specials: { label:"Especiales",   comp:"Specials", tab:"matches" },
  profile:  { label:"Perfil",       comp:"Profile",  tab:"profile" },
  groups:   { label:"Grupos",       comp:"Groups",   tab:"groups"  },
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "citrus",
  "showAdmin": true,
  "phrase": "El Mundial se juega en la cancha, se gana en Refugio."
}/*EDITMODE-END*/;

function StatusBar() {
  return (
    <div className="statusbar">
      <span>22:47</span>
      <div className="icons">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 18h3v-4H2zm5 0h3V10H7zm5 0h3V6h-3zm5 0h3V2h-3z"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M2 9a15 15 0 0120 0"/><path d="M5 12.5a10 10 0 0114 0"/><path d="M8.5 16a5 5 0 017 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="7" width="18" height="10" rx="2"/><rect x="4" y="9" width="13" height="6" rx="1" fill="currentColor"/><rect x="21" y="10" width="1.5" height="4" fill="currentColor"/></svg>
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("home");
  const [tweaks, setTweak] = (window.useTweaks || ((d)=>[d, ()=>{}]))(TWEAK_DEFAULTS);

  useEffect(() => {
    window.ProdeDB?.init();
  }, []);

  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  }, [screen, tweaks]);

  const go = (s) => setScreen(s);

  const Cur = window[SCREENS[screen]?.comp];
  const activeTab = SCREENS[screen]?.tab;

  // when accent tweak changes, swap neon var
  useEffect(() => {
    const map = {
      citrus: "#E8F26A",
      coral:  "#FF7A3D",
      sage:   "#B6BF93",
    };
    document.documentElement.style.setProperty("--neon-citrus", map[tweaks.accent] || map.citrus);
  }, [tweaks.accent]);

  return (
    <div className="stage">
      {/* MOBILE PHONE */}
      <div className="col">
        <div className="phone">
          <div className="statusbar">
            <span>22:47</span>
            <div className="icons">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 18h3v-4H2zm5 0h3V10H7zm5 0h3V6h-3zm5 0h3V2h-3z"/></svg>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M2 9a15 15 0 0120 0"/><path d="M5 12.5a10 10 0 0114 0"/><path d="M8.5 16a5 5 0 017 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="7" width="18" height="10" rx="2"/><rect x="4" y="9" width="13" height="6" rx="1" fill="currentColor"/><rect x="21" y="10" width="1.5" height="4" fill="currentColor"/></svg>
            </div>
          </div>
          <div className="viewport" key={screen}>
            {Cur ? <Cur go={go} tweaks={tweaks}/> : <div style={{padding:24, color:"#fff"}}>Loading…</div>}
            {activeTab && <TabBar active={activeTab} onChange={(id)=>{
              if (id==="home") go("home");
              else if (id==="matches") go("matches");
              else if (id==="ranking") go("ranking");
              else if (id==="groups") go("groups");
              else if (id==="profile") go("profile");
            }}/>}
          </div>
        </div>
        <div className="screenNav">
          {Object.keys(SCREENS).map(k => (
            <button key={k} className={screen===k?"on":""} onClick={()=>setScreen(k)}>
              {SCREENS[k].label}
            </button>
          ))}
          {tweaks.showAdmin && (
            <button className={"admin " + (screen==="admin"?"on":"")} onClick={()=>setScreen("admin")}>
              ★ Admin
            </button>
          )}
        </div>
        <div className="col-label">Prode Refugio · <b>iPhone 14 Pro</b></div>
      </div>

      {/* DESKTOP ADMIN PREVIEW */}
      {tweaks.showAdmin && (
        <div className="col" style={{display: screen === "admin" ? "flex" : "none"}}>
          <div className="desktop">
            <div className="desktop-titlebar">
              <span className="dot r"></span><span className="dot y"></span><span className="dot g"></span>
              <span className="desktop-url">refugio.cr/prode/admin</span>
            </div>
            <div className="desktop-body">
              <DesktopAdmin/>
            </div>
          </div>
          <div className="col-label">Panel Refugio · <b>Desktop staff</b></div>
        </div>
      )}

      {window.TweaksPanel && (
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection label="Acento">
            <window.TweakRadio
              label="Color de energía"
              value={tweaks.accent}
              onChange={v=>setTweak("accent", v)}
              options={[
                {value:"citrus", label:"Citrus"},
                {value:"coral",  label:"Coral"},
                {value:"sage",   label:"Sage"},
              ]}
            />
          </window.TweakSection>
          <window.TweakSection label="Vistas">
            <window.TweakToggle
              label="Mostrar panel Admin"
              value={tweaks.showAdmin}
              onChange={v=>setTweak("showAdmin", v)}
            />
          </window.TweakSection>
          <window.TweakSection label="Copy">
            <window.TweakText
              label="Frase de marca"
              value={tweaks.phrase}
              onChange={v=>setTweak("phrase", v)}
            />
          </window.TweakSection>
        </window.TweaksPanel>
      )}
    </div>
  );
}

function DesktopAdmin() {
  // Reuse the admin screen but with desktop layout — for simplicity render Admin in a scrolling container.
  // The Admin component is mobile-shaped; on desktop we present it as a wider 2-column layout.
  return (
    <div style={{
      display:"grid", gridTemplateColumns:"220px 1fr",
      height:"100%", color:"var(--cream-100)",
    }}>
      {/* sidebar */}
      <aside style={{
        background:"var(--char-800)", borderRight:"1px solid var(--char-700)",
        padding:"22px 16px", display:"flex", flexDirection:"column", gap:8,
      }}>
        <div style={{
          fontFamily:"var(--font-display)", fontSize:26, lineHeight:0.85,
          textTransform:"uppercase", color:"var(--orange-500)", marginBottom:14,
        }}>
          REFU<br/><span style={{paddingLeft:"0.55em", display:"inline-block", color:"var(--cream-100)"}}>GIO</span>
        </div>
        <div style={{
          fontSize:9, letterSpacing:"0.22em", textTransform:"uppercase",
          color:"var(--char-400)", fontWeight:700, padding:"4px 8px",
        }}>Panel</div>
        {["Dashboard","Partidos","Resultados","Jugadores","Anuncios","Premios","Reportes"].map((it,i) => (
          <button key={it} style={{
            display:"flex", alignItems:"center", gap:10,
            padding:"9px 12px", borderRadius:10, cursor:"pointer", textAlign:"left",
            background: i===1 ? "var(--char-700)" : "transparent",
            border: i===1 ? "1px solid var(--neon-citrus)" : "1px solid transparent",
            color:"var(--cream-100)",
            fontSize:12, fontWeight:600, fontFamily:"var(--font-body)",
          }}>
            <i data-lucide={["layout-dashboard","goal","check-check","users","megaphone","gift","bar-chart-3"][i]} style={{width:14,height:14}}></i>
            {it}
          </button>
        ))}
        <div style={{flex:1}}/>
        <div style={{
          padding:"10px 12px", borderRadius:10, background:"var(--char-900)",
          border:"1px solid var(--char-700)",
          display:"flex", alignItems:"center", gap:10,
        }}>
          <Avatar initials="R" size={28} tone="orange"/>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:11, color:"var(--cream-100)", fontWeight:700}}>Refugio Staff</div>
            <div style={{fontSize:9, color:"var(--char-400)", letterSpacing:"0.04em"}}>admin@refugio.cr</div>
          </div>
        </div>
      </aside>

      <main style={{padding:"22px 28px", overflow:"auto"}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:18}}>
          <div>
            <Eyebrow color="var(--neon-citrus)">Hoy · 11 Jun 2026</Eyebrow>
            <h1 style={{
              fontFamily:"var(--font-title)", fontSize:36, color:"var(--cream-100)",
              textTransform:"uppercase", letterSpacing:"0.02em", margin:"4px 0 0",
            }}>Calendario del Mundial</h1>
          </div>
          <div style={{display:"flex", gap:8}}>
            <Btn variant="ghost" size="md" icon="download">Exportar</Btn>
            <Btn variant="accent" size="md" icon="plus">Nuevo partido</Btn>
          </div>
        </div>

        {/* KPI row */}
        <div style={{display:"grid", gridTemplateColumns:"repeat(4, 1fr)", gap:12, marginBottom:20}}>
          <DKPI v="247"  l="Jugadores activos"  delta="+18 hoy"   tone="citrus"/>
          <DKPI v="1,432" l="Predicciones J1"    delta="+312 hoy"  tone="orange"/>
          <DKPI v="98%"  l="Cierre automático"  delta="2 abiertos" tone="sage"/>
          <DKPI v="$840" l="Premios entregados"  delta="3 esta sem" tone="tan"/>
        </div>

        {/* table */}
        <div style={{
          borderRadius:14, overflow:"hidden", background:"var(--char-800)",
          border:"1px solid var(--char-700)",
        }}>
          <div style={{
            padding:"12px 16px", borderBottom:"1px solid var(--char-700)",
            display:"grid", gridTemplateColumns:"60px 1fr 130px 200px 120px 90px 60px", gap:12,
            fontSize:9, letterSpacing:"0.22em", textTransform:"uppercase", color:"var(--char-400)", fontWeight:700,
          }}>
            <span>FECHA</span><span>Partido</span><span>Estado</span><span>Sede</span>
            <span>Hora</span><span style={{textAlign:"center"}}>Preds</span><span></span>
          </div>
          {window.MATCHES.slice(0, 9).map((m,i) => (
            <div key={m.id} style={{
              padding:"12px 16px", borderBottom: i<8 ? "1px solid var(--char-700)" : 0,
              display:"grid", gridTemplateColumns:"60px 1fr 130px 200px 120px 90px 60px", gap:12,
              alignItems:"center", fontSize:12,
            }}>
              <div style={{
                fontFamily:"var(--font-title)", fontSize:11, color:"var(--char-200)",
              }}>{m.date.slice(4)}</div>
              <div style={{display:"flex", alignItems:"center", gap:8}}>
                <Flag code={m.a} size={20}/>
                <span style={{color:"var(--cream-100)", fontWeight:600}}>{window.TEAMS[m.a]}</span>
                {m.status === "vivo" || m.status === "finalizado" ? (
                  <span style={{
                    fontFamily:"var(--font-title)", fontSize:13, color:"var(--neon-coral)", margin:"0 4px",
                  }}>{m.scoreA}–{m.scoreB}</span>
                ) : (
                  <span style={{color:"var(--char-500)", margin:"0 6px"}}>vs</span>
                )}
                <span style={{color:"var(--cream-100)", fontWeight:600}}>{window.TEAMS[m.b]}</span>
                <Flag code={m.b} size={20}/>
              </div>
              <div>
                {m.status === "vivo" ? <Pill tone="live">VIVO · {m.minute}</Pill> :
                 m.status === "finalizado" ? <Pill tone="done">FT</Pill> :
                 <Pill tone="open">Abierto</Pill>}
              </div>
              <div style={{color:"var(--char-200)", fontSize:11}}>{m.venue}</div>
              <div style={{color:"var(--char-200)", fontFamily:"var(--font-mono)"}}>{m.time}</div>
              <div style={{textAlign:"center", color:"var(--neon-citrus)", fontWeight:700}}>
                {Math.floor(180 + Math.random()*60)}
              </div>
              <div style={{textAlign:"right"}}>
                <button style={{
                  width:30, height:30, borderRadius:8, border:"1px solid var(--char-600)",
                  background:"var(--char-900)", color:"var(--char-200)", cursor:"pointer",
                  display:"inline-flex", alignItems:"center", justifyContent:"center",
                }}>
                  <i data-lucide="more-horizontal" style={{width:14,height:14}}></i>
                </button>
              </div>
            </div>
          ))}
        </div>

        {/* announcement composer */}
        <div style={{
          marginTop:20, padding:16, borderRadius:14,
          background:"var(--char-800)", border:"1px solid var(--char-700)",
          display:"grid", gridTemplateColumns:"1fr 280px", gap:16,
        }}>
          <div>
            <Eyebrow color="var(--neon-citrus)">Nuevo anuncio</Eyebrow>
            <textarea placeholder="Hoy Argentina vs Croacia en pantalla gigante..." style={{
              marginTop:8, width:"100%", padding:12, borderRadius:10,
              background:"var(--char-900)", color:"var(--cream-100)",
              border:"1px solid var(--char-700)", outline:"none", resize:"none",
              fontFamily:"var(--font-body)", fontSize:13, minHeight:80, boxSizing:"border-box",
            }}/>
            <div style={{display:"flex", gap:6, marginTop:10, alignItems:"center"}}>
              <Pill tone="open">AHORA</Pill>
              <Pill tone="ghost">PROMO</Pill>
              <Pill tone="ghost">FECHA</Pill>
              <div style={{flex:1}}/>
              <Btn variant="accent" size="sm" icon="send">Publicar</Btn>
            </div>
          </div>
          <div>
            <Eyebrow color="var(--char-200)">Activos · 3</Eyebrow>
            <div style={{marginTop:8, display:"flex", flexDirection:"column", gap:6}}>
              {window.ANNOUNCEMENTS.map(a => (
                <div key={a.id} style={{
                  padding:"8px 10px", borderRadius:10,
                  background:"var(--char-900)", border:"1px solid var(--char-700)",
                  fontSize:11, display:"flex", alignItems:"center", gap:8,
                }}>
                  <i data-lucide={a.icon} style={{width:12,height:12,color:"var(--neon-citrus)"}}></i>
                  <span style={{color:"var(--cream-100)", flex:1, fontWeight:600}}>{a.title}</span>
                  <span style={{fontSize:9, color:"var(--char-400)", letterSpacing:"0.1em"}}>{a.tag}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </main>
    </div>
  );
}

function DKPI({ v, l, delta, tone }) {
  const colors = {
    citrus:"var(--neon-citrus)", orange:"var(--orange-400)",
    sage:"var(--sage-300)", tan:"var(--tan-300)",
  };
  return (
    <div style={{
      padding:"14px 16px", borderRadius:14,
      background:"var(--char-800)", border:"1px solid var(--char-700)",
    }}>
      <Eyebrow color="var(--char-200)" style={{fontSize:9}}>{l}</Eyebrow>
      <div style={{
        fontFamily:"var(--font-title)", fontSize:32, color:colors[tone], lineHeight:1, marginTop:6,
      }}>{v}</div>
      <div style={{fontSize:10, color:"var(--char-400)", marginTop:5, letterSpacing:"0.06em"}}>↑ {delta}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
