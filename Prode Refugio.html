<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Prode Refugio · Mundial 2026</title>
<link rel="stylesheet" href="colors_and_type.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
  html,body{
    margin:0; min-height:100%;
    background:
      radial-gradient(circle at 20% 0%, rgba(191,97,42,0.10), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(232,242,106,0.06), transparent 50%),
      var(--char-900);
    font-family: var(--font-body);
    color: var(--cream-100);
    overflow-x:hidden;
  }
  *{box-sizing:border-box}
  button{font-family:var(--font-body);}
  input,textarea{font-family:var(--font-body);}
  /* hide scrollbars on horizontal scrollers */
  ::-webkit-scrollbar{ display:none; }

  /* layout */
  .stage{
    display:flex; gap:42px; justify-content:center; align-items:flex-start;
    padding:48px 24px 80px; min-height:100vh;
    flex-wrap:wrap;
  }
  .stage > .col{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .col-label{
    font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--char-400);
    font-weight:700; text-align:center;
  }
  .col-label b{ color: var(--neon-citrus); font-weight:700; }

  /* phone frame */
  .phone{
    width:392px; height:820px; border-radius:48px; overflow:hidden;
    background: var(--char-900);
    position:relative;
    box-shadow:
      0 0 0 11px #0c0b0a,
      0 0 0 12px #2a2724,
      0 0 0 13px #0c0b0a,
      0 40px 80px -30px rgba(0,0,0,0.85),
      0 20px 40px -20px rgba(0,0,0,0.6);
  }
  .phone::before{
    content:""; position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:106px; height:30px; background:#0c0b0a; border-radius:99px; z-index:30;
  }
  .phone .viewport{
    position:absolute; inset:0; overflow-y:auto;
    background:var(--char-900);
    display:flex; flex-direction:column;
    padding-top:46px;
  }
  .phone .viewport::-webkit-scrollbar{ display:none; }

  /* nav strip below phone */
  .screenNav{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:392px;
  }
  .screenNav button{
    padding:7px 11px; border-radius:999px; cursor:pointer;
    background: var(--char-800); border:1px solid var(--char-700);
    color: var(--char-200); font-weight:700;
    font-size:9px; letter-spacing:0.16em; text-transform:uppercase;
  }
  .screenNav button.on{
    background: var(--neon-citrus); color:var(--char-900); border-color:var(--neon-citrus);
  }
  .screenNav button.admin{ border-color: var(--orange-500); color:var(--orange-400); }
  .screenNav button.admin.on{ background:var(--orange-500); color:var(--cream-50); }

  /* header brand strip — show only at top of page */
  .brand-strip{
    width:100%; padding:18px 22px 0;
    display:flex; align-items:center; justify-content:space-between;
    color:var(--cream-100);
    position:absolute; top:0; left:0; z-index:5;
  }
  .brand-strip .lock{
    display:inline-flex; gap:8px; align-items:center;
    font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--char-400);
    font-weight:700;
  }

  /* phone status bar */
  .statusbar{
    position:absolute; top:0; left:0; right:0; height:46px; z-index:20;
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 32px 0; pointer-events:none;
    font-size:13px; font-weight:700; color:var(--cream-100);
    font-family:var(--font-body);
  }
  .statusbar .icons{ display:inline-flex; gap:5px; align-items:center; }
  .statusbar .icons svg{ width:14px; height:14px; }

  /* desktop preview (admin) */
  .desktop{
    width:980px; max-width:90vw; aspect-ratio:16/10;
    border-radius:18px; overflow:hidden;
    background: var(--char-900);
    border:1px solid var(--char-700);
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.85), 0 20px 40px -20px rgba(0,0,0,0.6);
    position:relative;
  }
  .desktop-titlebar{
    height:32px; background:var(--char-800); display:flex; align-items:center; gap:7px;
    padding:0 14px; border-bottom:1px solid var(--char-700);
  }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:#ff5f57 } .dot.y{ background:#febc2e } .dot.g{ background:#28c840 }
  .desktop-url{
    margin-left:14px; padding:4px 12px; border-radius:6px;
    background:var(--char-900); border:1px solid var(--char-700);
    font-family:var(--font-mono); font-size:10px; color:var(--char-400);
    letter-spacing:0.04em;
  }
  .desktop-body{
    position:absolute; inset:32px 0 0; overflow:hidden;
  }

  /* footer */
  .footer-meta{
    width:100%; padding:60px 24px 24px; text-align:center;
    color:var(--char-500); font-size:10px; letter-spacing:0.22em; text-transform:uppercase;
    font-weight:700;
  }
  .footer-meta b{ color:var(--neon-citrus); }

  /* real app shell */
  .brand-strip,.footer-meta{ display:none; }
  .app-shell{
    min-height:100vh;
    display:grid;
    grid-template-columns:260px minmax(0,1fr);
  }
  .app-sidebar{
    position:sticky; top:0; height:100vh;
    background:rgba(22,21,19,0.94);
    border-right:1px solid var(--char-700);
    padding:24px 16px;
    display:flex; flex-direction:column; gap:18px;
  }
  .app-brand{ display:flex; align-items:center; gap:12px; padding:0 8px 10px; }
  .app-logo{
    font-family:var(--font-display); font-size:28px; line-height:0.85;
    text-transform:uppercase; color:var(--orange-500);
  }
  .app-logo span{ padding-left:0.55em; display:inline-block; color:var(--cream-100); }
  .app-brand-meta{
    font-size:10px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--char-400); font-weight:700; line-height:1.45;
  }
  .app-nav{ display:flex; flex-direction:column; gap:6px; }
  .app-nav button{
    width:100%; min-height:42px;
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; border-radius:10px; cursor:pointer;
    background:transparent; border:1px solid transparent;
    color:var(--char-200); font-weight:700;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    text-align:left;
  }
  .app-nav button.on{
    background:var(--char-700); color:var(--cream-100);
    border-color:var(--neon-citrus);
  }
  .app-nav button.admin.on{ border-color:var(--orange-500); }
  .app-nav i{ width:16px; height:16px; flex-shrink:0; }
  .app-side-card{
    margin-top:auto; padding:12px; border-radius:12px;
    background:var(--char-900); border:1px solid var(--char-700);
  }
  .app-main{
    min-width:0; min-height:100vh;
    display:flex; justify-content:center;
    padding:28px 28px 48px;
  }
  .app-content{
    width:100%; max-width:760px;
    background:rgba(26,25,22,0.72);
    border:1px solid var(--char-700);
    min-height:calc(100vh - 76px);
    overflow:hidden;
    border-radius:18px;
  }
  .app-content.wide{ max-width:1180px; }
  .mobile-bottom-nav{ display:none; }

  @media (max-width: 860px){
    .app-shell{ display:block; min-height:100vh; }
    .app-sidebar{ display:none; }
    .app-main{ display:block; padding:0 0 84px; min-height:100vh; }
    .app-content,.app-content.wide{
      max-width:none; min-height:100vh; border:0; border-radius:0; background:var(--char-900);
    }
    .mobile-bottom-nav{
      position:fixed; left:10px; right:10px; bottom:10px; z-index:100;
      display:flex; gap:4px; padding:5px;
      border-radius:999px; background:rgba(18,17,15,0.96);
      border:1px solid var(--char-700);
      box-shadow:0 -12px 30px -14px rgba(0,0,0,.75);
    }
    .mobile-bottom-nav button{
      flex:1; min-width:0; height:54px;
      border:0; border-radius:999px; cursor:pointer;
      background:transparent; color:var(--char-200);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
      font-size:8px; letter-spacing:0.14em; text-transform:uppercase; font-weight:700;
    }
    .mobile-bottom-nav button.on{ background:var(--orange-500); color:var(--cream-50); }
    .mobile-bottom-nav i{ width:18px; height:18px; }
  }
</style>
</head>
<body>

<div class="brand-strip">
  <div style="font-family:Mauren,sans-serif;font-size:22px;line-height:0.85;text-transform:uppercase;color:var(--orange-500);">
    REFU<br/><span style="padding-left:0.55em;display:inline-block;color:var(--cream-100);">GIO</span>
  </div>
  <div class="lock">
    <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--neon-citrus);box-shadow:0 0 10px var(--neon-citrus);"></span>
    Prode Mundial '26 · v0.1 · Tamarindo
  </div>
</div>

<div id="root"></div>

<!-- data + components -->
<script src="data.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-service.js"></script>
<script src="app-store.js"></script>
<script type="text/babel" data-source="components.jsx">
/* ============================================================
   PRODE REFUGIO — Componentes compartidos
   ============================================================ */

const { useState, useEffect, useRef } = React;

/* ---------- Flag ---------- */
function Flag({ code, size = 28, ring = false }) {
  return (
    <div style={{
      width: size, height: size, borderRadius: "50%",
      backgroundImage: `url(${window.FLAG(code)})`,
      backgroundSize: "cover", backgroundPosition: "center",
      boxShadow: ring ? "0 0 0 2px var(--cream-100), 0 0 0 3px var(--char-700)" : "inset 0 0 0 1px rgba(245,238,217,0.18)",
      flexShrink: 0,
    }}/>
  );
}

/* ---------- Eyebrow ---------- */
function Eyebrow({ children, color = "var(--neon-citrus)", style }) {
  return <div style={{
    fontSize: 10, letterSpacing: "0.22em", textTransform: "uppercase",
    fontWeight: 600, color, fontFamily: "var(--font-body)", ...style,
  }}>{children}</div>;
}

/* ---------- Pill (status / phase chip) ---------- */
function Pill({ children, tone = "ghost", style }) {
  const tones = {
    ghost:  { bg:"transparent", color:"var(--char-200)", border:"1px solid rgba(245,238,217,0.18)" },
    live:   { bg:"var(--neon-coral)", color:"var(--char-900)", border:"0" },
    open:   { bg:"transparent", color:"var(--neon-citrus)", border:"1px solid var(--neon-citrus)" },
    closed: { bg:"transparent", color:"var(--char-400)", border:"1px solid var(--char-500)" },
    done:   { bg:"var(--char-700)", color:"var(--char-200)", border:"1px solid var(--char-600)" },
    orange: { bg:"var(--orange-500)", color:"var(--cream-50)", border:"0" },
  };
  const t = tones[tone] || tones.ghost;
  return <span style={{
    display:"inline-flex", alignItems:"center", gap:6,
    padding:"3px 9px", borderRadius:999,
    fontSize:9, letterSpacing:"0.2em", textTransform:"uppercase", fontWeight:700,
    fontFamily:"var(--font-body)",
    background:t.bg, color:t.color, border:t.border, ...style,
  }}>{children}</span>;
}

/* ---------- Button ---------- */
function Btn({ children, variant="primary", size="md", onClick, full, style, icon }) {
  const sizes = {
    sm: { padding:"9px 14px", fontSize:10 },
    md: { padding:"14px 22px", fontSize:11 },
    lg: { padding:"18px 28px", fontSize:12 },
  };
  const variants = {
    primary: { background:"var(--orange-500)", color:"var(--cream-50)", border:"0" },
    accent:  { background:"var(--neon-citrus)", color:"var(--char-900)", border:"0" },
    ghost:   { background:"transparent", color:"var(--cream-100)", border:"1.5px solid var(--cream-100)" },
    dark:    { background:"var(--char-900)", color:"var(--cream-100)", border:"1px solid var(--char-600)" },
  };
  return (
    <button onClick={onClick} style={{
      width: full ? "100%" : "auto",
      display:"inline-flex", alignItems:"center", justifyContent:"center", gap:8,
      borderRadius:999, cursor:"pointer", fontFamily:"var(--font-body)",
      fontWeight:700, letterSpacing:"0.22em", textTransform:"uppercase",
      transition:"transform .18s cubic-bezier(.2,.7,.2,1), filter .18s",
      ...sizes[size], ...variants[variant], ...style,
    }}
    onMouseEnter={e=>e.currentTarget.style.transform="translateY(-1px)"}
    onMouseLeave={e=>e.currentTarget.style.transform="translateY(0)"}>
      {icon && <i data-lucide={icon} style={{width:14,height:14,strokeWidth:2.25}}></i>}
      {children}
    </button>
  );
}

/* ---------- AppBar (top of mobile screen) ---------- */
function AppBar({ title, subtitle, back, onBack, right }) {
  return (
    <div style={{
      display:"flex", alignItems:"center", gap:12,
      padding:"14px 18px 6px",
      position:"sticky", top:0, zIndex:10,
      background:"linear-gradient(180deg, var(--char-900) 0%, var(--char-900) 70%, rgba(26,25,22,0) 100%)",
    }}>
      {back ? (
        <button onClick={onBack} style={{
          width:36, height:36, borderRadius:"50%", border:"1px solid var(--char-600)",
          background:"var(--char-800)", color:"var(--cream-100)", cursor:"pointer",
          display:"flex", alignItems:"center", justifyContent:"center",
        }}>
          <i data-lucide="chevron-left" style={{width:18,height:18}}></i>
        </button>
      ) : (
        <div style={{
          fontFamily:"var(--font-display)", fontSize:22, lineHeight:0.85,
          textTransform:"uppercase", color:"var(--orange-500)",
        }}>
          REFU<br/><span style={{paddingLeft:"0.55em", display:"inline-block", color:"var(--cream-100)"}}>GIO</span>
        </div>
      )}
      <div style={{flex:1, paddingLeft: back ? 0 : 8}}>
        {subtitle && <Eyebrow color="var(--neon-citrus)">{subtitle}</Eyebrow>}
        <div style={{
          fontFamily:"var(--font-title)", fontSize:back?20:18, textTransform:"uppercase",
          color:"var(--cream-100)", letterSpacing:"0.02em", lineHeight:1.05, marginTop:2,
        }}>{title}</div>
      </div>
      {right}
    </div>
  );
}

/* ---------- TabBar (bottom nav) ---------- */
function TabBar({ active, onChange }) {
  const items = [
    { id:"home",     icon:"home",      label:"Home" },
    { id:"matches",  icon:"goal",      label:"Prode" },
    { id:"ranking",  icon:"trophy",    label:"Ranking" },
    { id:"groups",   icon:"users",     label:"Grupos" },
    { id:"profile",  icon:"user",      label:"Yo" },
  ];
  return (
    <nav style={{
      position:"sticky", bottom:10, margin:"0 12px 10px",
      display:"flex", padding:5, borderRadius:999,
      background:"var(--char-900)",
      border:"1px solid var(--char-700)",
      boxShadow:"0 -10px 30px -10px rgba(0,0,0,.6)",
      zIndex:10,
    }}>
      {items.map(it => {
        const on = it.id === active;
        return (
          <button key={it.id} onClick={()=>onChange(it.id)} style={{
            flex:1, padding:"10px 0", border:0, cursor:"pointer",
            display:"flex", flexDirection:"column", alignItems:"center", gap:3,
            background: on ? "var(--orange-500)" : "transparent",
            color: on ? "var(--cream-50)" : "var(--char-200)",
            borderRadius:999, fontSize:8, letterSpacing:"0.2em",
            textTransform:"uppercase", fontWeight:700,
            transition:"all .2s cubic-bezier(.2,.7,.2,1)",
          }}>
            <i data-lucide={it.icon} style={{width:18,height:18,strokeWidth:on?2.25:1.75}}></i>
            <span>{it.label}</span>
          </button>
        );
      })}
    </nav>
  );
}

/* ---------- Avatar (initials disc) ---------- */
function Avatar({ initials, size = 36, tone = "olive", ring = false, you = false }) {
  const tones = {
    olive:  { bg:"var(--olive-500)",  fg:"var(--cream-50)" },
    orange: { bg:"var(--orange-500)", fg:"var(--cream-50)" },
    sage:   { bg:"var(--sage-300)",   fg:"var(--char-900)" },
    tan:    { bg:"var(--tan-500)",    fg:"var(--cream-50)" },
    citrus: { bg:"var(--neon-citrus)",fg:"var(--char-900)" },
    char:   { bg:"var(--char-700)",   fg:"var(--cream-100)" },
  };
  const t = tones[tone] || tones.olive;
  return (
    <div style={{
      width:size, height:size, borderRadius:"50%",
      background:t.bg, color:t.fg,
      display:"flex", alignItems:"center", justifyContent:"center",
      fontFamily:"var(--font-title)", fontWeight:700,
      fontSize: size*0.4, letterSpacing:"0.04em",
      boxShadow: you ? "0 0 0 2px var(--neon-citrus), 0 0 0 4px var(--char-900)"
                     : (ring ? "0 0 0 2px var(--cream-100), 0 0 0 3px var(--char-700)" : "none"),
      flexShrink:0,
    }}>{initials}</div>
  );
}

/* ---------- BadgeChip ---------- */
function BadgeChip({ kind, size = "sm" }) {
  const b = window.BADGES[kind];
  if (!b) return null;
  const small = size === "sm";
  return (
    <div style={{
      display:"inline-flex", alignItems:"center", gap: small?6:8,
      padding: small ? "3px 8px 3px 4px" : "5px 12px 5px 6px",
      background:"var(--char-700)", border:"1px solid var(--char-600)",
      borderRadius:999, color:"var(--cream-100)",
    }}>
      <span style={{
        width: small?16:22, height: small?16:22, borderRadius:"50%",
        background:b.color, color:"var(--char-900)",
        display:"flex", alignItems:"center", justifyContent:"center",
        fontWeight:700, fontSize: small?10:13,
      }}>{b.emoji}</span>
      <span style={{
        fontSize: small?9:11, letterSpacing:"0.18em", textTransform:"uppercase",
        fontFamily:"var(--font-body)", fontWeight:700,
      }}>{b.label}</span>
    </div>
  );
}

/* ---------- Countdown ---------- */
function Countdown({ target = "2026-06-12T18:00:00", label = "Argentina vs Croacia" }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(()=>setNow(Date.now()), 1000); return ()=>clearInterval(t); }, []);
  const diff = Math.max(0, new Date(target).getTime() - now);
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  const Cell = ({ v, l }) => (
    <div style={{flex:1, textAlign:"center"}}>
      <div style={{
        fontFamily:"var(--font-title)", fontSize:36, color:"var(--cream-100)",
        lineHeight:1, letterSpacing:"0.02em",
      }}>{String(v).padStart(2,"0")}</div>
      <div style={{
        fontSize:9, letterSpacing:"0.24em", color:"var(--char-400)",
        textTransform:"uppercase", fontWeight:600, marginTop:6,
      }}>{l}</div>
    </div>
  );
  return (
    <div>
      <div style={{display:"flex", gap:6}}>
        <Cell v={d} l="Días"/>
        <div style={{color:"var(--char-600)", fontFamily:"var(--font-title)", fontSize:32}}>:</div>
        <Cell v={h} l="Hs"/>
        <div style={{color:"var(--char-600)", fontFamily:"var(--font-title)", fontSize:32}}>:</div>
        <Cell v={m} l="Min"/>
        <div style={{color:"var(--char-600)", fontFamily:"var(--font-title)", fontSize:32}}>:</div>
        <Cell v={s} l="Seg"/>
      </div>
      <div style={{
        marginTop:10, fontSize:11, letterSpacing:"0.16em", textTransform:"uppercase",
        color:"var(--char-200)", fontWeight:600, textAlign:"center",
      }}>Próximo: <span style={{color:"var(--neon-citrus)"}}>{label}</span></div>
    </div>
  );
}

/* ---------- MatchRow (compact) ---------- */
function MatchRow({ match, prediction, onChange, locked }) {
  const m = match;
  const live = m.status === "vivo";
  const done = m.status === "finalizado";
  const open = m.status === "abierto";

  // For done matches, show real score; for vivo, show real running score; for open, show inputs.
  const showLiveScore = live || done;

  return (
    <div style={{
      background: live ? "linear-gradient(180deg, rgba(255,122,61,0.08), rgba(255,122,61,0) 60%), var(--char-800)" : "var(--char-800)",
      border: live ? "1px solid var(--neon-coral)" : "1px solid var(--char-700)",
      borderRadius: 22, padding: "14px 14px 12px", marginBottom: 12,
    }}>
      {/* top row: phase + status */}
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
        <Eyebrow color="var(--char-400)" style={{letterSpacing:"0.18em"}}>{m.phase}</Eyebrow>
        {live ? <Pill tone="live"><span style={{
          width:6, height:6, borderRadius:"50%", background:"var(--char-900)",
          animation:"pulse 1.2s infinite",
        }}/>EN VIVO · {m.minute}</Pill> :
         done ? <Pill tone="done">FT</Pill> :
         <Pill tone="open">Abierto</Pill>}
      </div>

      {/* match body */}
      <div style={{
        display:"grid",
        gridTemplateColumns:"1fr 88px 1fr",
        alignItems:"center", gap:6,
      }}>
        {/* TEAM A */}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

  const avatars = ["orange","citrus","sage","tan","olive","char"];
  const favs = ["ARG","CRC","BRA","URU","MEX","COL","ESP","FRA","ENG","USA","GER","ITA"];
  const initials = name.split(" ").map(w=>w[0]).slice(0,2).join("") || "??";

      name,
      phone,
      favoriteTeam: team,
      avatarTone: avatars[avatar],
      avatar: initials,
      mode,
      groupName: mode === "create" ? groupName : "",

<script type="text/babel" data-source="screens/Matches.jsx">
/* ============================================================
   SCREEN: Matches (predicciones)
   ============================================================ */

function Matches({ go }) {
  const [filter, setFilter] = useState("todos"); // todos | hoy | abiertos | mios
  const [preds, setPreds] = useState(window.ProdeStore?.getPredictions?.() || { ...window.MY_PREDICTIONS });
  const [toast, setToast] = useState(null);

  useEffect(() => {
    const onData = () => setPreds(window.ProdeStore?.getPredictions?.() || { ...window.MY_PREDICTIONS });
    window.addEventListener("prode:data", onData);
    return () => window.removeEventListener("prode:data", onData);
  }, []);

  const setPred = async (id, val) => {
    setPreds(p => ({ ...p, [id]: val }));
    setToast("Guardado");
    window.ProdeStore?.savePrediction(id, val).catch((error) => {
      console.warn("[Prode Refugio] No se pudo guardar la prediccion.", error);
      setToast("Guardado local");
    });
    setTimeout(()=>setToast(null), 1400);
  };

  const all = window.MATCHES;
  const filtered = all.filter(m => {
    if (filter === "abiertos") return m.status === "abierto";
    if (filter === "hoy")      return m.date.startsWith("Jue 11") || m.status === "vivo";
    if (filter === "mios")     return preds[m.id];
    return true;
  });

  // group by date
  const groups = {};
  filtered.forEach(m => {
    groups[m.date] = groups[m.date] || [];
    groups[m.date].push(m);
  });

  // stats
  const total = all.filter(m => m.status === "abierto").length;
  const done  = Object.keys(preds).filter(id => all.find(m => m.id === id && m.status === "abierto")).length;

  return (
    <div style={{paddingBottom: 16}}>
      <AppBar title="Predicciones" subtitle={`Mundial 2026 · Fase de grupos`}
        right={
          <div style={{textAlign:"right"}}>
            <div style={{
              fontFamily:"var(--font-title)", fontSize:18, color:"var(--neon-citrus)", lineHeight:1,
            }}>{done}<span style={{color:"var(--char-500)", fontSize:13}}>/{total}</span></div>
            <Eyebrow color="var(--char-400)" style={{fontSize:8}}>Cargadas</Eyebrow>
          </div>
        }/>

      {/* progress bar */}
      <div style={{padding:"0 16px 4px"}}>
        <div style={{
          height:5, borderRadius:999, background:"var(--char-700)", overflow:"hidden",
        }}>
          <div style={{
            width:`${total ? (done/total)*100 : 0}%`, height:"100%",
            background:"linear-gradient(90deg, var(--orange-500), var(--neon-citrus))",
            transition:"width .3s",
          }}/>
        </div>
        <div style={{
          marginTop:7, fontSize:11, color:"var(--char-200)", letterSpacing:"0.06em",
          fontStyle:"italic",
        }}>"Poné el resultado antes de que ruede la pelota."</div>
      </div>

      {/* filters */}
      <div style={{
        padding:"14px 16px 6px",
        display:"flex", gap:7, overflowX:"auto", scrollbarWidth:"none",
      }}>
        {[
          {id:"todos",   label:"Todos"},
          {id:"hoy",     label:"Hoy"},
          {id:"abiertos",label:"Abiertos"},
          {id:"mios",    label:"Mis predicciones"},
        ].map(f => {
          const on = filter === f.id;
          return (
            <button key={f.id} onClick={()=>setFilter(f.id)} style={{
              padding:"7px 14px", borderRadius:999, flexShrink:0,
              border:`1px solid ${on ? "var(--neon-citrus)" : "var(--char-600)"}`,
              background: on ? "var(--neon-citrus)" : "transparent",
              color: on ? "var(--char-900)" : "var(--cream-100)",
              fontFamily:"var(--font-body)", fontWeight:700,
              fontSize:10, letterSpacing:"0.18em", textTransform:"uppercase",
              cursor:"pointer",
            }}>{f.label}</button>
          );
        })}
      </div>

      {/* match groups */}
      <div style={{padding:"12px 16px 0"}}>
        {Object.entries(groups).map(([date, ms]) => (
          <div key={date}>
            <div style={{
              display:"flex", alignItems:"center", gap:10,
              padding:"14px 0 6px",
            }}>
              <Eyebrow color="var(--neon-citrus)">{date}</Eyebrow>
              <div style={{flex:1, height:1, background:"var(--char-700)"}}/>
              <Eyebrow color="var(--char-500)">{ms.length} partidos</Eyebrow>
            </div>
            {ms.map(m => (
              <MatchRow key={m.id} match={m}
                prediction={preds[m.id]}
                onChange={(v)=>setPred(m.id, v)}
                locked={m.status !== "abierto"}/>
            ))}
          </div>
        ))}
      </div>

      {/* especiales banner */}
      <div style={{padding:"6px 16px 0"}}>
        <button onClick={()=>go("specials")} style={{
          width:"100%", textAlign:"left", border:0, padding:0, cursor:"pointer",
          background:"transparent",
        }}>
          <div style={{
            borderRadius:22, padding:"18px",
            background:"linear-gradient(135deg, var(--orange-700), var(--char-800))",
            border:"1px solid var(--orange-500)",
            display:"flex", alignItems:"center", gap:14,
          }}>
            <div style={{
              width:54, height:54, borderRadius:"50%",
              background:"var(--char-900)",
              display:"flex", alignItems:"center", justifyContent:"center",
              border:"1.5px solid var(--neon-citrus)",
            }}>
              <i data-lucide="star" style={{width:24,height:24,color:"var(--neon-citrus)",strokeWidth:2}}></i>
            </div>
            <div style={{flex:1}}>
              <Eyebrow color="var(--neon-citrus)">Bonus · 5 pts c/u</Eyebrow>
              <div style={{
                fontFamily:"var(--font-title)", fontSize:18, color:"var(--cream-100)",
                textTransform:"uppercase", letterSpacing:"0.02em", marginTop:3,
              }}>Predicciones especiales</div>
              <div style={{fontSize:11, color:"var(--char-200)", marginTop:4}}>
                Campeón, goleador, sorpresa →
              </div>
            </div>
          </div>
        </button>
      </div>

      {/* toast */}
      {toast && (
        <div style={{
          position:"fixed", bottom:80, left:"50%", transform:"translateX(-50%)",
          background:"var(--neon-citrus)", color:"var(--char-900)",
          padding:"10px 18px", borderRadius:999,
          fontFamily:"var(--font-body)", fontWeight:700,
          fontSize:11, letterSpacing:"0.22em", textTransform:"uppercase",
          boxShadow:"0 12px 30px -8px rgba(0,0,0,0.5)",
          zIndex:50, display:"flex", alignItems:"center", gap:8,
        }}>
          <i data-lucide="check" style={{width:13,height:13,strokeWidth:3}}></i>
          {toast}
        </div>
      )}

      <style>{`
        @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.3 } }
      `}</style>
    </div>
  );
}

window.Matches = Matches;

</script>

          <div style={{

          {r.trend !== "flat" && (
            <i data-lucide={r.trend==="up"?"arrow-up":"arrow-down"} style={{
              width:10, height:10, marginTop:2,

            }}></i>
          )}

      </div>
      {expanded && (

    </div>

</script>
<script type="text/babel" data-source="screens/Specials.jsx">

function SpecialRow({ icon, tone, label, sub, current, children }) {

          maxWidth:120, overflow:"hidden", textOverflow:"ellipsis",
        }}>{current || "—"}</div>

    </div>
  );
}

function ScorerPick({ value, onChange, options }) {
  const list = options || [
    "Kylian Mbappé", "Lionel Messi", "Lautaro Martínez", "Erling Haaland",
    "Vinícius Jr.", "Harry Kane", "Julián Álvarez", "Pedri",

  return (

      {list.map(n => {
        const on = value === n;
        return (

            fontFamily:"var(--font-body)",
          }}>{n}</button>
        );
      })}
    </div>
  );
}

window.Specials = Specials;

</script>

          window.ProdeStore?.clearPlayer?.();
          go("register");

    </div>
  );

    <div style={{

          className={(screen === item.screen ? "on " : "") + (item.admin ? "admin" : "")}
          onClick={() => go(item.screen)}>
          <i data-lucide={item.icon}></i>
          {item.label}
        </button>
      ))}
    </nav>
  );
}

function MobileBottomNav({ screen, go }) {
  const items = NAV_ITEMS.filter(item => item.screen !== "admin");
  return (
    <nav className="mobile-bottom-nav">
      {items.map(item => (
        <button key={item.screen} className={screen === item.screen ? "on" : ""} onClick={() => go(item.screen)}>
          <i data-lucide={item.icon}></i>
          <span>{item.label}</span>
        </button>
      ))}
    </nav>
  );
}

function App() {
  const [screen, setScreen] = useState("home");
  const [tweaks] = (window.useTweaks || ((d)=>[d, ()=>{}]))(TWEAK_DEFAULTS);
  const isDesktop = useIsDesktop();

  useEffect(() => {
    window.ProdeDB?.init();
  }, []);

  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  }, [screen, tweaks, isDesktop]);

  useEffect(() => {
    const map = { citrus: "#E8F26A", coral: "#FF7A3D", sage: "#B6BF93" };
    document.documentElement.style.setProperty("--neon-citrus", map[tweaks.accent] || map.citrus);
  }, [tweaks.accent]);

  const go = (next) => setScreen(next);
  const Cur = screen === "admin" && isDesktop ? DesktopAdmin : window[SCREENS[screen]?.comp];
  const wide = screen === "admin" && isDesktop;

  return (
    <div className="app-shell">
      <aside className="app-sidebar">
        <div className="app-brand">
          <div className="app-logo">REFU<br/><span>GIO</span></div>
          <div className="app-brand-meta">Prode Mundial '26<br/>Tamarindo</div>
        </div>
        <AppNav screen={screen} go={go}/>
        <div className="app-side-card">
          <Eyebrow color="var(--neon-citrus)">Estado</Eyebrow>
          <div style={{fontFamily:"var(--font-title)",fontSize:18,color:"var(--cream-100)",textTransform:"uppercase",marginTop:5}}>247 jugadores</div>
          <div style={{fontSize:11,color:"var(--char-400)",marginTop:4}}>Predicciones abiertas para la fase de grupos.</div>
        </div>
      </aside>

      <main className="app-main">
        <div className={"app-content " + (wide ? "wide" : "")}>
          {Cur ? <Cur go={go} tweaks={tweaks}/> : <div style={{padding:24}}>Cargando...</div>}
        </div>
      </main>

      <MobileBottomNav screen={screen} go={go}/>
    </div>
  );
}

            fontSize:12, fontWeight:600, fontFamily:"var(--font-body)",

          display:"flex", alignItems:"center", gap:10,
        }}>
          <Avatar initials="R" size={28} tone="orange"/>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:11, color:"var(--cream-100)", fontWeight:700}}>Refugio Staff</div>
            <div style={{fontSize:9, color:"var(--char-400)", letterSpacing:"0.04em"}}>admin@refugio.cr</div>
          </div>
        </div>
      </aside>

      <main style={{padding:"22px 28px", overflow:"auto"}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:18}}>

            <Eyebrow color="var(--neon-citrus)">Hoy · 11 Jun 2026</Eyebrow>

            <Btn variant="accent" size="md" icon="plus">Nuevo partido</Btn>

        </div>

          <DKPI v="247"  l="Jugadores activos"  delta="+18 hoy"   tone="citrus"/>
          <DKPI v="1,432" l="Predicciones J1"    delta="+312 hoy"  tone="orange"/>
          <DKPI v="98%"  l="Cierre automático"  delta="2 abiertos" tone="sage"/>
          <DKPI v="$840" l="Premios entregados"  delta="3 esta sem" tone="tan"/>

          borderRadius:14, overflow:"hidden", background:"var(--char-800)",

              <div>

          display:"grid", gridTemplateColumns:"1fr 280px", gap:16,

function DKPI({ v, l, delta, tone }) {
  const colors = {
    citrus:"var(--neon-citrus)", orange:"var(--orange-400)",
    sage:"var(--sage-300)", tan:"var(--tan-300)",
  };
  return (
    <div style={{
      padding:"14px 16px", borderRadius:14,
      background:"var(--char-800)", border:"1px solid var(--char-700)",
    }}>
      <Eyebrow color="var(--char-200)" style={{fontSize:9}}>{l}</Eyebrow>
      <div style={{
        fontFamily:"var(--font-title)", fontSize:32, color:colors[tone], lineHeight:1, marginTop:6,
      }}>{v}</div>
      <div style={{fontSize:10, color:"var(--char-400)", marginTop:5, letterSpacing:"0.06em"}}>↑ {delta}</div>
    </div>
  );
}
